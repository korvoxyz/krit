[workspace]
members = [
    "crates/krit",
    "crates/krit-capability",
    "crates/krit-cli",
    "crates/krit-package",
    "crates/krit-runtime",
    "crates/krit-wasm",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
authors = ["Akshay Bhardwaj"]
license = "Apache-2.0"
repository = "https://github.com/akshay-bhardwaj/Krit"

[workspace.dependencies]
krit = { path = "crates/krit" }
krit-capability = { path = "crates/krit-capability" }
krit-package = { path = "crates/krit-package" }
krit-runtime = { path = "crates/krit-runtime" }
krit-wasm = { path = "crates/krit-wasm" }
blake3 = "1.8.7"
curl = { version = "=0.4.50", default-features = false, features = [
    "rustls",
    "static-curl",
] }
http = { version = "=1.5.0", default-features = false, features = ["std"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
tiny_http = { version = "=0.12.0", default-features = false }
url = { version = "=2.5.8", default-features = false, features = ["std"] }
wasmtime = { version = "47.0.4", default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }
wasm-encoder = { version = "0.258.0", default-features = false, features = ["std"] }
wasm-metadata = { version = "0.258.0", default-features = false }
wasmparser = { version = "0.258.0", default-features = false, features = [
    "component-model",
    "features",
    "prefer-btree-collections",
    "std",
    "validate",
] }
wit-component = { version = "0.258.0", default-features = false }
wit-parser = { version = "0.258.0", default-features = false, features = ["std"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
