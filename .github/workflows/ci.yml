name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Rust 1.94 quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests and conformance
        run: cargo test --workspace --all-targets --locked

      - name: Build release binary
        run: cargo build --workspace --release --locked

      - name: Check CLI, package, and examples
        run: |
          target/release/krit --version
          target/release/krit package check
          test "$(target/release/krit run examples/factorial.krit)" = "720"
          test "$(target/release/krit run examples/lists.krit)" = $'[10, 20, 12]\n42'

  current-stable:
    name: Current stable Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --workspace --all-targets --locked
