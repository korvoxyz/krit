name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  version:
    name: Validate release identity
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      series: ${{ steps.version.outputs.series }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a matching stable version tag
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || {
            echo "::error::Run releases from a version tag, not a branch."
            exit 1
          }
          version="$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[] | select(.name == "krit-cli") | .version')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$GITHUB_REF_NAME" == "v$version" ]] || {
            echo "::error::The tag must equal v plus the Cargo workspace version."
            exit 1
          }
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .draft")"
          if grep -qx false <<< "$existing"; then
            echo "::error::This release is already published. Never move a published tag."
            exit 1
          fi
          {
            echo "version=$version"
            echo "series=${version%.*}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: Release quality and native packages
    needs: version
    uses: ./.github/workflows/ci.yml

  containers:
    name: Container ${{ matrix.arch }}
    needs: [version, ci]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.image }}
    steps:
      - name: Check out release packaging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the native Linux package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: krit-${{ matrix.target }}
          path: dist

      - name: Verify and extract the container payload
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check -- *.sha256)
          mkdir -p "$RUNNER_TEMP/krit-image/package"
          tar -xzf "dist/krit-$VERSION-$TARGET.tar.gz" \
            --strip-components=1 -C "$RUNNER_TEMP/krit-image/package"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the container from the tested binary
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ runner.temp }}/krit-image
          file: .github/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: krit:release-test
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}

      - name: Exercise the non-root container without network access
        run: |
          set -euo pipefail
          test "$(docker run --rm --network none krit:release-test --version)" = "Krit $VERSION"
          test "$(docker run --rm --network none krit:release-test run examples/factorial.krit)" = "720"
          test "$(docker run --rm --network none --entrypoint sh krit:release-test -ec 'krit build >/dev/null && krit sandbox')" = "720"

      - name: Authenticate to GitHub Packages
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the native container
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ runner.temp }}/krit-image
          file: .github/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-${{ matrix.arch }}
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}

      - name: Record the immutable container digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s\n' "$DIGEST" > "digest-$ARCH.txt"

      - name: Upload the container digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 14

  image:
    name: Publish and attest the container index
    needs: [version, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.image }}
    steps:
      - name: Download immutable container digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: container-digest-*
          path: digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to GitHub Packages
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Only the version tag is written here; the series and latest tags move
      # in the last job, once the release itself is published.
      - name: Publish the multi-architecture index
        id: index
        run: |
          set -euo pipefail
          amd64="$(<digests/digest-amd64.txt)"
          arm64="$(<digests/digest-arm64.txt)"
          [[ "$amd64" =~ ^sha256:[a-f0-9]{64}$ && "$arm64" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=Human-auditable, capability-scoped agent language" \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$VERSION" \
            "$IMAGE@$amd64" "$IMAGE@$arm64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::Could not read the digest of $IMAGE:$VERSION."
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the multi-architecture index
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          # A storage record needs artifact-metadata: write and is not used to
          # verify the image.
          create-storage-record: false

      - name: Verify the index attestation
        run: |
          set -euo pipefail
          gh attestation verify "oci://$IMAGE:$VERSION" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "$GITHUB_REF"

      - name: Report package visibility
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          set -euo pipefail
          owner_type="$(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.type)"
          if [[ "$owner_type" == Organization ]]; then
            scope=orgs
          else
            scope=users
          fi
          package="${GITHUB_REPOSITORY##*/}"
          endpoint="$scope/$GITHUB_REPOSITORY_OWNER/packages/container/${package,,}"
          visibility="$(gh api "$endpoint" --jq .visibility)"
          {
            echo "### Krit $VERSION"
            echo "- Package: $IMAGE:$VERSION ($visibility)"
            echo "- Attested index: $IMAGE@$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$visibility" != public ]]; then
            echo "::warning::GitHub creates container packages privately. A package admin must select Package settings > Change visibility > Public once to enable anonymous downloads."
            echo "- Required once: set the container package visibility to Public in GitHub Package settings." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Attest and publish release downloads
    needs: [version, ci, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.version.outputs.image }}
      # Marks the draft as this run's own until it is published under its
      # public title.
      DRAFT_TITLE: Krit ${{ needs.version.outputs.version }} (draft, release run ${{ github.run_id }})
    steps:
      - name: Download all native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: krit-*
          path: dist
          merge-multiple: true

      - name: Verify archives and collect checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check -- *.sha256
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          sha256sum -- *.tar.gz *.zip | LC_ALL=C sort -k2 > SHA256SUMS

      - name: Attest the archives and SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

      - name: Verify the archive attestations
        working-directory: dist
        run: |
          set -euo pipefail
          for file in *.tar.gz *.zip SHA256SUMS; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF"
          done

      # Published releases are immutable. Assets go only to a draft that this
      # run created, so rerunning failed jobs can finish an interrupted upload;
      # any other release for the tag, published or draft, stops the run.
      - name: Upload the downloads to this run's draft release
        working-directory: dist
        run: |
          set -euo pipefail
          notes="Krit $VERSION is the Rust-based, capability-scoped agent language release.

          Download the archive for your operating system and CPU, verify it with SHA256SUMS, and extract it. No Rust toolchain is required. Each archive includes the CLI, examples, build identity, and dependency license notices.

          Every archive, SHA256SUMS, and the container image carry a GitHub build provenance attestation: \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY\`.

          GitHub Packages: \`docker run --rm $IMAGE:$VERSION --version\` (Linux AMD64 and ARM64).

          This is an early, pre-1.0 release, not a production-readiness claim. The macOS and Windows binaries are not developer-signed/notarized. See README.md for supported platforms, installation, and limitations."
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | [.draft, .name] | @tsv")"
          if [[ -z "$releases" ]]; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --title "$DRAFT_TITLE" --notes "$notes" \
              -- *.tar.gz *.zip SHA256SUMS
          elif [[ "$releases" == "true"$'\t'"$DRAFT_TITLE" ]]; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              -- *.tar.gz *.zip SHA256SUMS
          elif grep -q $'^false\t' <<< "$releases"; then
            echo "::error::Release $GITHUB_REF_NAME is already published, and published releases are never modified. Ship changes as a new patch release."
            exit 1
          else
            echo "::error::A draft release for $GITHUB_REF_NAME exists that this run did not create. A maintainer must review and delete it before the release is retried."
            exit 1
          fi

      - name: Verify the draft release
        working-directory: dist
        run: |
          set -euo pipefail
          state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft,name --jq '[.isDraft, .name] | @tsv')"
          [[ "$state" == "true"$'\t'"$DRAFT_TITLE" ]] || {
            echo "::error::Release $GITHUB_REF_NAME is no longer this run's draft."
            exit 1
          }
          check="$RUNNER_TEMP/release-check"
          mkdir -- "$check"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$check"
          expected="$(printf '%s\n' *.tar.gz *.zip SHA256SUMS | LC_ALL=C sort)"
          actual="$(cd "$check" && printf '%s\n' * | LC_ALL=C sort)"
          [[ "$actual" == "$expected" ]] || {
            echo "::error::The draft's assets are not exactly the attested downloads."
            exit 1
          }
          for file in *.tar.gz *.zip SHA256SUMS; do
            cmp -s -- "$file" "$check/$file" || {
              echo "::error::The draft's $file differs from the attested file."
              exit 1
            }
          done

      - name: Publish the release
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "Krit $VERSION" --draft=false --latest
          echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

  tags:
    name: Move the series and latest container tags
    needs: [version, image, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SERIES: ${{ needs.version.outputs.series }}
      IMAGE: ${{ needs.version.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Authenticate to GitHub Packages
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Point the series and latest tags at the attested index
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::The image job did not report the attested index digest."
            exit 1
          }
          docker buildx imagetools create --tag "$IMAGE:$SERIES" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          for tag in "$VERSION" "$SERIES" latest; do
            actual="$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)"
            [[ "$actual" == "$DIGEST" ]] || {
              echo "::error::$IMAGE:$tag resolves to $actual, not the attested index $DIGEST."
              exit 1
            }
          done
          echo "- Container tags $SERIES and latest: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
